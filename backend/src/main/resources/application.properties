# ============================================================
# CONEXAO ILPI - Application Properties
# ============================================================

spring.application.name=conexao-ilpi-api
server.port=8080

# ------------------------------------------------------------
# Database
# ------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/conexao_ilpi?useSSL=false&serverTimezone=America/Recife&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------------------------
# JPA / Hibernate
# ------------------------------------------------------------
# Schema is managed by src/main/resources/schema.sql (classpath:schema.sql) — Hibernate should not touch it.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ------------------------------------------------------------
# Schema initialisation
# Spring Boot will run classpath:schema.sql then classpath:data.sql automatically.
# Both files live in src/main/resources.
# Switch to 'never' once the DB is stable in production.
# ------------------------------------------------------------
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# ------------------------------------------------------------
# Admin Setup
# Override SETUP_SECRET_KEY via environment variable in production.
# ------------------------------------------------------------
app.setup.secret-key=${SETUP_SECRET_KEY:dev-setup-key-change-me}

# ------------------------------------------------------------
# Serialization
# ------------------------------------------------------------
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Recife
