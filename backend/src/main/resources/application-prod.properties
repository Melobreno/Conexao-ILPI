# ============================================================
# CONEXAO ILPI — Production Profile
# All sensitive values must be set as environment variables.
# Render injects them automatically from the service dashboard.
# ============================================================

# ------------------------------------------------------------
# Database (Railway MySQL — set these in Render environment)
# DATASOURCE_URL  → jdbc:mysql://<host>:<port>/<db>?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true
# DATASOURCE_USER → railway (or your DB user)
# DATASOURCE_PASS → <railway password>
# ------------------------------------------------------------
spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=${DATASOURCE_USER}
spring.datasource.password=${DATASOURCE_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------------------------
# JPA / Hibernate
# ddl-auto=none — schema managed by schema.sql
# ------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ------------------------------------------------------------
# Schema initialisation
# mode=always so schema.sql + data.sql run on first boot.
# Switch to 'never' after the first successful deploy.
# ------------------------------------------------------------
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# ------------------------------------------------------------
# Admin setup key
# SETUP_SECRET_KEY → any strong random string you choose
# ------------------------------------------------------------
app.setup.secret-key=${SETUP_SECRET_KEY}

# ------------------------------------------------------------
# Serialization
# ------------------------------------------------------------
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# ------------------------------------------------------------
# Server
# PORT is injected by Render automatically
# ------------------------------------------------------------
server.port=${PORT:8080}
