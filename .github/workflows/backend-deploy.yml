# ============================================================
# CONEXAO ILPI — Backend CI/CD
# Builds the Spring Boot JAR, pushes a Docker image to
# GitHub Container Registry (ghcr.io), then triggers a
# Render deploy via Deploy Hook URL.
#
# Required GitHub Secrets (Settings → Secrets → Actions):
#   RENDER_DEPLOY_HOOK_URL  → Render service deploy hook URL
#                             (Render dashboard → your service → Settings → Deploy Hook)
# ============================================================

name: Backend — Build & Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build JAR + Deploy to Render
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write   # needed to push to ghcr.io

    steps:
      # ── 1. Checkout ────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up JDK 17 ───────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # ── 3. Build JAR (skip tests for speed; run them separately) ──
      - name: Build with Maven
        working-directory: backend
        run: mvn package -B -DskipTests

      # ── 4. Log in to GitHub Container Registry ─────────────
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 5. Build & push Docker image ───────────────────────
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/conexao-ilpi-api:latest
            ghcr.io/${{ github.repository_owner }}/conexao-ilpi-api:${{ github.sha }}

      # ── 6. Trigger Render deploy hook ──────────────────────
      - name: Trigger Render deploy
        run: |
          curl -s --fail -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            -o /dev/null -w "HTTP status: %{http_code}\n"
