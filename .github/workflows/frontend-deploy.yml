# ============================================================
# CONEXAO ILPI — Frontend CI/CD
# Builds the Angular SPA and deploys it to GitHub Pages.
#
# Setup (one-time, in GitHub):
#   Repository → Settings → Pages → Source: "GitHub Actions"
#
# API URL is hardcoded in src/environments/environment.prod.ts
# ============================================================

name: Frontend — Build & Deploy

on:
  push:
    branches:
      - master
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-deploy.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build Angular + Deploy to GitHub Pages
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # ── 1. Checkout ────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Node ─────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── 3. Install dependencies ────────────────────────────
      - name: Install dependencies
        working-directory: frontend
        run: npm install

      # ── 4. Build for production ────────────────────────────
      # --base-href must match your GitHub Pages sub-path.
      # e.g. for https://username.github.io/Conexao-ILPI/ use /Conexao-ILPI/
      - name: Build Angular
        working-directory: frontend
        run: |
          npx ng build \
            --configuration production \
            --base-href /Conexao-ILPI/

      # ── 6. Upload Pages artifact ───────────────────────────
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/conexao-ilpi-frontend/browser

      # ── 7. Deploy to GitHub Pages ──────────────────────────
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
